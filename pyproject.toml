[tool.poetry]
name = "player-modeling-lab"
version = "0.1.0"
description = "POC de Player Modeling com Engenharia de Dados e Machine Learning"
authors = ["Mateus Oliveira", "Anderson Freire"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
fastapi = "^0.141.1"
uvicorn = "^0.52.4"
pyjwt = "^2.14.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
bcrypt = "^5.0.0"
pydantic = "^2.13.5"
alembic = "^1.20.0"
pika = "^1.4.4"

[tool.poetry.group.dev.dependencies]
ruff = "^0.6"
mypy = "^1.11"
pytest = "^8.3"
pre-commit = "^3.8"
httpx = "^0.28.1"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "player_modeling.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
