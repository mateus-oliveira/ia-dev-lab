repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [alembic]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (testes rápidos)
        entry: bash -c 'poetry run pytest -q; code=$?; [ "$code" = "0" ] || [ "$code" = "5" ]'
        language: system
        pass_filenames: false
        always_run: true

      - id: check-commit-message
        name: validação da mensagem de commit (ADR 0002)
        entry: poetry run python scripts/check_commit_message.py
        language: system
        stages: [commit-msg]

      - id: check-branch
        name: validação da branch atual (ADR 0002)
        entry: poetry run python scripts/check_branch.py
        language: system
        pass_filenames: false
        always_run: true

      - id: check-sensitive-paths
        name: detecção de arquivos sensíveis
        entry: poetry run python scripts/check_sensitive_paths.py
        language: system

      - id: check-readme-tree-granularity
        name: granularidade da árvore de diretórios do README (ADR 0009)
        entry: poetry run python scripts/check_readme_tree_granularity.py
        language: system
        pass_filenames: false
        always_run: true
